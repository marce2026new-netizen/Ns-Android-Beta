name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CryptoBotAndroid-proyecto.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q CryptoBotAndroid-proyecto.zip -d source

      - name: Build debug APK
        working-directory: source/CryptoBotAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoBot-Demo-APK
          path: source/CryptoBotAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
